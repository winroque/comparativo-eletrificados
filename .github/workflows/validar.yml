name: Validar dados

on:
  pull_request:
  push:
    branches-ignore: [main]

jobs:
  validar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/build-manifest.mjs
      - run: git diff --exit-code data/manifest.json || (echo "Rode 'npm run manifest' e faça commit do data/manifest.json" && exit 1)
      - run: node scripts/validate.mjs
      - run: node scripts/build-dados.mjs
      - run: git diff --exit-code data/dados.json || (echo "Rode 'npm run build' e faça commit do data/dados.json" && exit 1)
